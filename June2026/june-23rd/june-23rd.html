<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play and Stop</title>
</head>
<body>

    <audio id="tune">
        <source src="King_&_Pounder.mp3" type="audio/mpeg">
    </audio>
    <button onclick="play()" type="button">Play</button>
    <button onClick="pause()" type="button">Stop</button>

    <script>
        let audio = document.getElementById("tune")

        const play = () => {
            audio.play();
        }
        
        const pause = () => {
            audio.pause();
        }

    </script>
    
</body>
</html>
